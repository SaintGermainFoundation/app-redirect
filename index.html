<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get the App</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f4f4f6;
    text-align: center;
  }
  .box {
    padding: 2rem;
  }
  a.button {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.8rem 1.6rem;
    background: #1a73e8;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  }
  p.note {
    color: #666;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="box">
    <p>Redirecting you to the app store…</p>
    <p class="note">If nothing happens, tap below.</p>
    <a class="button" id="manualLink" href="#">Open App</a>
  </div>

  <script>
    // Store links
    var iosUrl = "https://apps.apple.com/app/id6766966104";
    var androidUrl = "https://play.google.com/store/apps/details?id=org.saintgermainfoundation.iamradio";

    var ua = navigator.userAgent || navigator.vendor || window.opera;

    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isAndroid = /android/i.test(ua);

    var target = isIOS ? iosUrl : (isAndroid ? androidUrl : androidUrl);
    // Default (desktop / unknown) sends to Android/Play page — change if you'd prefer a landing page instead.

    document.getElementById("manualLink").href = target;

    // Auto-redirect after a brief moment
    setTimeout(function () {
      window.location.href = target;
    }, 400);
  </script>
</body>
</html>
